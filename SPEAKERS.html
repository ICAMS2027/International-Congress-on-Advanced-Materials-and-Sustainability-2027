<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICAMS 2027 - Ponentes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN Y LOGO -->
  <header class="site-header">
    <nav class="navbar">
      <div class="container navbar-container">
        
        <a href="index.html" class="navbar-brand">
          <img src="images/logo.png" alt="ICAMS 2027 Logo" class="logo-img">
          <span class="brand-text">ICAMS 2027</span>
        </a>

        <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">&#9776;</button>

        <div class="nav-menu" id="navMenu">
          <div class="nav-menu-header">
            <span class="nav-menu-title">ICAMS 2027</span>
            <button class="nav-close" id="navClose" aria-label="Cerrar menú">&times;</button>
          </div>

          <ul class="nav-list">
            <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
            <li class="nav-item"><a href="about.html" class="nav-link">Acerca de</a></li>
            <li class="nav-item"><a href="speakers.html" class="nav-link active">Ponentes</a></li>
            <li class="nav-item"><a href="program.html" class="nav-link">Programa</a></li>
            <li class="nav-item"><a href="contact.html" class="nav-link">Contacto</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <!-- SECCIÓN DE PONENTES CON HOVER OCULTO QUE SOLO APARECE AL PASAR EL CURSOR -->
  <main class="container">
    <h1>Ponentes Invitados</h1>

    <div class="speakers-grid">
      
      <!-- Tarjeta 1 -->
      <div class="hover-card">
        <img src="images/speaker1.jpg" alt="Ponente 1" class="card-img">
        <div class="hover-content">
          <h3>Dr. Nombre del Ponente</h3>
          <p>Especialista en Nanotecnología y Síntesis Verde de Nanopartículas.</p>
        </div>
      </div>

      <!-- Tarjeta 2 -->
      <div class="hover-card">
        <img src="images/speaker2.jpg" alt="Ponente 2" class="card-img">
        <div class="hover-content">
          <h3>Dra. Nombre de la Ponente</h3>
          <p>Investigadora en Fotocatálisis y Degradación de Contaminantes.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- SCRIPT PARA MENÚ MÓVIL -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navToggle = document.getElementById('navToggle');
      const navClose = document.getElementById('navClose');
      const navMenu = document.getElementById('navMenu');

      if (navToggle && navMenu) {
        navToggle.addEventListener('click', () => navMenu.classList.add('open'));
      }
      if (navClose && navMenu) {
        navClose.addEventListener('click', () => navMenu.classList.remove('open'));
      }
    });
  </script>
</body>
</html>
